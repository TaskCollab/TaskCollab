version: "3.8"
services:
  spring-boot-app:
    build:
      context: ./Task-Collab-BackEnd
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    expose:
      - "8080"
    volumes:
      - ./Task-Collab-BackEnd/target/app.jar:/app/app.jar
    depends_on:
      - 310-sqlserver
  310-sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: 310-sqlserver
    restart: always
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: '310#sa#pw'
    ports:
      - '1433:1433'
    expose:
      - '1433'
    volumes:
      - 310-db:/var/lib/mssql
      - ./Task-Collab-BackEnd/ddl:/scripts
    command:
      - /bin/bash
      - -c
      - |
        /opt/mssql/bin/sqlservr &
        pid=$$!
        echo "Waiting for MS SQL to be available"
        /opt/mssql-tools18/bin/sqlcmd -l 30 -S localhost -h-1 -V1 -U sa -P $$SA_PASSWORD -C -Q "SET NOCOUNT ON SELECT \"YAY WE ARE UP\" , @@servername"
        is_up=$$?
        while [ $$is_up -ne 0 ] ; do
          echo -e $$(date)
          /opt/mssql-tools18/bin/sqlcmd -l 30 -S localhost -h-1 -V1 -U sa -P $$SA_PASSWORD -C -Q "SET NOCOUNT ON SELECT \"YAY WE ARE UP\" , @@servername"
          is_up=$$?
          sleep 5
        done
        for foo in scripts/SQLServer1.ddl
          do /opt/mssql-tools18/bin/sqlcmd -U sa -P $$SA_PASSWORD -C -l 30 -e -i $$foo
        done
        trap "kill -15 $$pid" SIGTERM
        wait $$pid
        exit 0
  frontend:
    build:
      context: ./Task-Collab-FrontEnd
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./Task-Collab-FrontEnd:/app
      - /app/node_modules
    working_dir: /app
    command: ["npm", "start"]
volumes:
  310-db:
  db-config: